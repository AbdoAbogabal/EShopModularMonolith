version: '3.4'

services:
  eshopdb:
   container_name: eshopdb
   environment:
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=postgres
    - POSTGRES_DB=eshopdb
   restart: always
   ports:
    - "5432:5432"
   volumes:
    - postgres_eshopdb:/var/lib/postgresql/data
    
  create-schema:
    image: postgres
    depends_on:
      - eshopdb
    environment:
      - PGPASSWORD=postgres
    command: >
      bash -c "sleep 10 &&
      psql -h eshopdb -U postgres -d eshopdb -c 'CREATE SCHEMA IF NOT EXISTS identity;'"
    restart: "no"

  distriputedcache:
    container_name: distriputedcache
    restart: always
    ports:
      - "6379:6379"

  seq:
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=9812171
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    restart: always
    ports:
      - "5341:5341"
      - "9091:80"

  messagebroker:
   container_name: messagebroker
   hostname: ecommerce_mq
   environment:
    - RABBITMQ_DEFAULT_USER=guest
    - RABBITMQ_DEFAULT_PASSWORD=guest
   restart: always
   ports:
    - "5672:5672"
    - "15672:15672" 
  
  identity:
    container_name: identity
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://eshopdb/eshopdb?currentSchema=identity 
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
    ports:
      - "9090:8080"
    depends_on:
      - create-schema
    command: start-dev
    restart: always